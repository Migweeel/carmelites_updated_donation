services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carmel_communion
      POSTGRES_USER: carmel
      POSTGRES_PASSWORD: carmel_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmel -d carmel_communion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
